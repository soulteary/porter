name: Linux recovery acceptance
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build production and test-only operator images
        run: |
          docker build --build-arg COMMIT="$GITHUB_SHA" -t porter-linux:candidate .
          docker build -f tests/linux/fixture.Dockerfile -t porter-linux:fixture .
          docker build -f tests/linux/recovery.Dockerfile -t porter-linux:recovery .
      - name: Bounded capacity and offline recovery acceptance
        run: python3 tests/linux.py --porter-image porter-linux:candidate --fixture-image porter-linux:fixture --recovery-image porter-linux:recovery --evidence linux-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-recovery-evidence
          path: linux-evidence.json
          retention-days: 14
