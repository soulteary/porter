name: Production acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production image and baseline upgrade acceptance
        run: python3 tests/production.py
