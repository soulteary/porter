name: Real service contracts
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate complete response-header assertions
        run: python3 -m unittest discover -s tests/contracts -v
      - name: Porter, Stargate and Warden contracts
        run: python3 tests/contracts.py --evidence service-contracts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-contracts
          path: service-contracts.json
          retention-days: 14
