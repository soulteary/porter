name: Supply chain
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate workflows
        if: matrix.arch == 'amd64'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate release failure gates
        if: matrix.arch == 'amd64'
        run: python3 -m unittest discover -s tests/release -v
      - name: Build and start native production image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'verification' }}
        run: |
          set -euo pipefail
          docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" -t porter-supply-chain .
          test "$(docker image inspect --format '{{.Architecture}}' porter-supply-chain)" = "$ARCH"
          image_user="$(docker image inspect --format '{{.Config.User}}' porter-supply-chain)"
          test "${image_user%%:*}" = 65532
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true porter-supply-chain version --json > version.json
          python3 -c 'import json,os; d=json.load(open("version.json")); assert d["version"]==os.environ["VERSION"] and d["commit"]==os.environ["GITHUB_SHA"]'
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false
      - name: Generate SBOM and gate fixable high and critical vulnerabilities
        run: |
          set -euo pipefail
          trivy image --image-src docker --scanners vuln --format cyclonedx --output sbom.cdx.json porter-supply-chain
          trivy image --image-src docker --scanners vuln --format json --output vulnerabilities.json porter-supply-chain
          trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 porter-supply-chain
      - name: Native arm64 production startup and compatibility
        if: matrix.arch == 'arm64'
        run: python3 tests/production.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supply-chain-${{ matrix.arch }}
          path: |
            version.json
            sbom.cdx.json
            vulnerabilities.json
          retention-days: 14
          if-no-files-found: error
