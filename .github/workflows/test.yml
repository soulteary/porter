name: Go
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -ldflags="-X main.version=ci -X main.commit=${GITHUB_SHA}" ./cmd/porter
      - name: Version metadata
        run: ./porter version --json | python3 -c 'import json, os, sys; data=json.load(sys.stdin); assert data["version"] == "ci" and data["commit"] == os.environ["GITHUB_SHA"]'
      - name: Chromium login form acceptance
        run: |
          PORTER_CHROME="$(command -v google-chrome)"
          export PORTER_CHROME
          test -x "$PORTER_CHROME"
          go test ./internal/gateway -run TestBrowserForms -count=1 -v
      - name: Nginx trust boundary integration
        run: |
          docker build -f tests/nginx.Dockerfile -t porter-nginx-check .
          docker run --rm porter-nginx-check
