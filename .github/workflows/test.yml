name: Go
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -ldflags="-X main.version=ci -X main.commit=${GITHUB_SHA}" ./cmd/porter
      - name: Version metadata
        run: ./porter version --json | python3 -c 'import json, os, sys; data=json.load(sys.stdin); assert data["version"] == "ci" and data["commit"] == os.environ["GITHUB_SHA"]'
      - name: Chromium login form acceptance
        run: |
          PORTER_CHROME="$(command -v google-chrome)"
          export PORTER_CHROME
          test -x "$PORTER_CHROME"
          go test ./internal/gateway -run TestBrowserForms -count=1 -v
      - name: Nginx trust boundary integration
        run: |
          docker build -f tests/nginx.Dockerfile -t porter-nginx-check .
          docker run --rm porter-nginx-check
