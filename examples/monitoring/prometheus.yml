global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/porter.rules.yml
scrape_configs:
  - job_name: porter
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/porter-management-key
    static_configs:
      - targets: [porter:9093]
  - job_name: porter-readiness
    metrics_path: /probe
    scrape_timeout: 5s
    params:
      module: [porter_ready]
    static_configs:
      - targets: [http://porter:9093/readyz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
