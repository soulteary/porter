# Template: replace DNS names, certificates, secrets and upstreams before use.
# Requires the ngx_http_auth_request_module. Serve one origin per Porter instance.
# Never log callback query strings. $uri excludes the query string.
log_format porter_safe '$remote_addr $request_method $uri $status';
upstream porter_backend { server porter:8083; }
upstream application_backend { server application:8080; }
server {
    listen 443 ssl;
    server_name login.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    access_log /var/log/nginx/access.log porter_safe;

    # Porter checks its session, then calls Stargate server-to-server.
    # Set stargate_url and stargate_secret in Porter's configuration.
    location = /_access {
        internal;
        proxy_pass http://porter_backend/auth;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host login.example.com;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "Bearer REPLACE_PORTER_PROXY_KEY";
    }

    location ~ ^/(login(?:/(?:github|google|wechat|qq))?|callback/(?:github|google|wechat|qq)|logout)$ {
        proxy_pass http://porter_backend;
        proxy_set_header Host login.example.com;
        # Provider callbacks contain authorization codes. Suppress error logs
        # here too: upstream errors can otherwise include the original URL.
        access_log off;
        error_log /dev/null crit;
    }

    location / {
        auth_request /_access;
        error_page 401 = /login;
        auth_request_set $authorized_user $upstream_http_x_forwarded_user;
        auth_request_set $authorized_mail $upstream_http_x_auth_email;
        auth_request_set $authorized_role $upstream_http_x_auth_role;
        auth_request_set $authorized_scopes $upstream_http_x_auth_scopes;
        proxy_pass http://application_backend;
        # A narrow allowlist avoids forwarding client-supplied identity/secret
        # headers. Add application-specific non-identity headers deliberately.
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Forwarded-User $authorized_user;
        proxy_set_header X-Auth-Email $authorized_mail;
        proxy_set_header X-Auth-Role $authorized_role;
        proxy_set_header X-Auth-Scopes $authorized_scopes;
    }
}
